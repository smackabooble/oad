<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>0 A.D.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0b0b;color:#d8c9a3;font:14px/1.5 system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;outline:none;background:#000}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0b0b;transition:opacity .6s;z-index:5;text-align:center;padding:0 24px}
#splash.done{opacity:0;pointer-events:none}
#splash h1{margin:0;font-size:28px;letter-spacing:.08em;font-weight:600}
#splash p{margin:0;max-width:560px;color:#a8a08a}
.bar{width:260px;height:4px;background:#2a2518;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#c9a24a;animation:slide 1.4s infinite ease-in-out}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
#msg{color:#e6b66a;white-space:pre-wrap}
#log{position:fixed;left:0;bottom:0;max-height:30vh;overflow:auto;margin:0;padding:6px 8px;background:#000c;white-space:pre-wrap;width:100%;box-sizing:border-box;font:12px/1.4 monospace;z-index:6}
#log:empty{display:none}
#dl{display:none;flex-direction:column;align-items:center;gap:12px;width:min(420px,90vw)}
#dl button{background:#c9a24a;color:#1a1608;border:0;border-radius:4px;padding:10px 22px;font:600 15px system-ui;cursor:pointer}
#pbar{width:100%;height:10px;background:#2a2518;border-radius:5px;overflow:hidden;display:none}
#pbar i{display:block;height:100%;width:0;background:#c9a24a}
#ptxt{font-size:13px;color:#a8a08a;min-height:20px}

#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:default;
  background:radial-gradient(ellipse at 50% 45%,#3a0d0d 0%,#1a0707 45%,#050303 100%);color:#e2c27a;opacity:1;transition:opacity 1s ease}
#intro.out{opacity:0;pointer-events:none}
#intro .band{position:absolute;left:0;right:0;height:34px;opacity:.55;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='68' height='34' viewBox='0 0 68 34'><path d='M4 30V4h28v20H16V12h8' fill='none' stroke='%23c9a24a' stroke-width='3' stroke-linecap='square'/><path d='M38 30V4h28v20H50V12h8' fill='none' stroke='%23c9a24a' stroke-width='3' stroke-linecap='square'/></svg>") repeat-x center}
#intro .band.top{top:26px}#intro .band.bot{bottom:26px;transform:scaleY(-1)}
#intro .small{font:500 clamp(13px,2.4vw,20px)/1 Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.55em;text-indent:.55em;color:#b89a5c;opacity:0;animation:fadeUp 1.2s .5s forwards}
#intro .name{font:700 clamp(34px,9vw,104px)/1.05 Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.14em;text-indent:.14em;opacity:0;
  background:linear-gradient(100deg,#8a6a2a 0%,#f3dc9a 40%,#c9a24a 55%,#fff1bd 62%,#9b7a33 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #c9a24a33;
  animation:fadeUp 1.4s 1.1s forwards,shine 3.2s 1.4s ease-in-out forwards}
#intro .rule{height:2px;width:0;background:linear-gradient(90deg,transparent,#c9a24a,transparent);animation:grow 1.6s 1.6s forwards}
#intro .skip{position:absolute;bottom:80px;font:12px system-ui;color:#7a6a45;letter-spacing:.2em;opacity:0;animation:fadeUp 1s 2.4s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:min(60vw,520px)}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
</head>
<body>
<div id="intro">
<div class="small">PORTED BY</div><div class="name">KALAKARITZU</div><div class="rule"></div></div>
<script>
(function(){
  const el=document.getElementById('intro'); let done=false;
  function end(){ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),1100); }
  // The very first visit reloads once (service worker enables cross-origin isolation): show the intro after that reload.
  if(!window.crossOriginIsolated && 'serviceWorker' in navigator){ el.remove(); return; }
  setTimeout(end,5200);
})();
</script>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="splash"><h1>0 A.D.</h1><div class="bar" id="spin"><i></i></div>
<p id="status">Loading&hellip;</p>
<div id="dl"><button id="go">Download and play</button><div id="pbar"><i></i></div><div id="ptxt"></div></div>
<p id="msg"></p></div>
<pre id="log"></pre>

<script>
const params = new URLSearchParams(location.search);
const debug = params.has('debug');
const logEl = document.getElementById('log'), msgEl = document.getElementById('msg'), splash = document.getElementById('splash');
function hideSplash(){ splash.classList.add('done'); setTimeout(() => splash.remove(), 800); }
const LOGKEY='oad-lastlog', RUNKEY='oad-running';
const ring=[], firstErr=[], seenCnt=new Map(); let ringDirty=false;
function ringAdd(t){
  t=String(t).slice(0,300);
  const k=t.replace(/[0-9.]+/g,'#'); const c=(seenCnt.get(k)||0)+1; seenCnt.set(k,c);
  if(c>3 && /ABORT|Abort|window error|proxy_async|error/i.test(t)){ if(c%1000===0) t+=' (repeated '+c+' times)'; else return; }
  const line=((performance.now()/1000)|0)+'s '+t;
  if(firstErr.length<40 && /ERROR|ABORT|Abort|Assertion|unreachable|out of memory|window error|rejection|lost/i.test(t) && !/audio device|COLLADA|get_average/.test(t)) firstErr.push(line);
  ring.push(line); if(ring.length>300) ring.shift(); ringDirty=true;
}
function ringSave(){ if(!ringDirty) return; ringDirty=false; try{ localStorage.setItem(LOGKEY, 'FIRST ERRORS:\n'+firstErr.join('\n')+'\n\nRECENT:\n'+ring.join('\n')); }catch(e){} }
setInterval(()=>{
  let m=''; try{ if(performance.memory) m=' jsheap='+(performance.memory.usedJSHeapSize/1048576|0)+'MB'; if(typeof wasmMemory!=='undefined') m+=' wasm='+(wasmMemory.buffer.byteLength/1048576|0)+'MB'; }catch(e){}
  ringAdd('hb'+m); ringSave();
}, 3000);
try{
  const prev=localStorage.getItem(RUNKEY), plog=localStorage.getItem(LOGKEY);
  localStorage.setItem(RUNKEY,'1');
  if(prev && plog){
    const b=document.createElement('div');
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:20;background:#5a1d12;color:#fff;padding:8px 12px;font:13px system-ui;display:flex;gap:10px;align-items:center';
    b.innerHTML='<span style="flex:1">The last session ended unexpectedly (crash or freeze).</span><button id="cplog">Copy its log</button><button id="xlog">Dismiss</button>';
    addEventListener('DOMContentLoaded',()=>document.body.appendChild(b));
    addEventListener('click',e=>{
      if(e.target.id==='cplog'){ navigator.clipboard.writeText(plog).then(()=>{e.target.textContent='Copied - paste it to Claude';}).catch(()=>{prompt('Copy this log:',plog.slice(-6000));}); }
      if(e.target.id==='xlog') b.remove();
    });
  }
}catch(e){}
addEventListener('pagehide',()=>{ ringAdd('pagehide'); ringSave(); try{ localStorage.removeItem(RUNKEY); }catch(e){} });
addEventListener('error',e=>{ ringAdd('window error: '+e.message); ringSave(); });
addEventListener('unhandledrejection',e=>{ ringAdd('unhandled rejection: '+(e.reason&&e.reason.message||e.reason)); ringSave(); });
function log(t){
  console.log(t); ringAdd(t);
  if (/mainmenu\.xml|GAME STARTED|session\/session\.xml/.test(t)) hideSplash();
  const important = /ERROR|ABORT|WARNING|isolated|unavailable/i.test(t);
  if (important && !/COLLADA|get_average_color|OS error|dumping stack/.test(t)) msgEl.textContent = t.slice(0, 300);
  if (!debug && !important) return;
  logEl.textContent += t + '\n'; logEl.scrollTop = logEl.scrollHeight;
}
if (typeof WebAssembly.Suspending === 'undefined' && typeof WebAssembly.promising === 'undefined')
  msgEl.textContent = 'This browser lacks WebAssembly JSPI support. Please use a recent Chromium-based browser (Chrome/Edge 137 or newer).';
// Browsers keep audio suspended until the user interacts with the page: remember every AudioContext the engine
// creates and resume them on the first click/key press.
(function(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctxs = [];
  function Patched(...args){ const c = new AC(...args); ctxs.push(c); return c; }
  Patched.prototype = AC.prototype; window.AudioContext = Patched;
  const unlock = () => ctxs.forEach(c => { if (c.state === 'suspended') c.resume(); });
  ['pointerdown','keydown','touchend'].forEach(ev => addEventListener(ev, unlock, { capture: true }));
})();
const canvas = document.getElementById('canvas');
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); log('ERROR: WebGL context lost - please reload the page'); }, false);
canvas.addEventListener('contextmenu', e => e.preventDefault());
var Module = {
  canvas,
  print: log, printErr: log,
  arguments: (params.get('args') || '').split(' ').filter(Boolean),
  onAbort: w => log('ABORT: ' + w),
};
</script>
<script>
const statusEl=document.getElementById('status'), dl=document.getElementById('dl'), spin=document.getElementById('spin');
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(0)+' MB';
function bootEngine(){
  statusEl.textContent='Starting the engine\u2026 the first start can take a minute.';
  dl.style.display='none'; spin.style.display='';
  const s=document.createElement('script'); s.src='pyrogenesis.js'; document.body.appendChild(s);
}
async function opfsComplete(){
  try{
    const d=await (await (await navigator.storage.getDirectory()).getDirectoryHandle('gamedata')).getFileHandle('_complete.json');
    return JSON.parse(await (await d.getFile()).text());
  }catch(e){return null;}
}
async function main(){
  if(params.has('reset')){
    await new Promise(r=>{const w=new Worker('dl-worker.js');w.onmessage=()=>r();w.postMessage({cmd:'wipe'});});
    location.replace(location.pathname); return;
  }
  if(typeof WebAssembly.Suspending==='undefined'){return;}   // message already shown
  const local = !('serviceWorker' in navigator) || (window.crossOriginIsolated && !navigator.serviceWorker.controller);
  if(local){ if(!window.crossOriginIsolated) return; return bootEngine(); }   // served by serve.py
  const reg=await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  if(!window.crossOriginIsolated){
    if(sessionStorage.getItem('oad-reloaded')){ msgEl.textContent='Could not enable cross-origin isolation (service worker blocked?).'; return; }
    sessionStorage.setItem('oad-reloaded','1'); location.reload(); return;
  }
  let cfg;
  try{ cfg=await (await fetch('data-config.json',{cache:'no-store'})).json(); }
  catch(e){ statusEl.textContent='data-config.json missing - the game data host is not configured.'; return; }
  const done=await opfsComplete();
  if(done && done.version===cfg.version) return bootEngine();
  const files=cfg.files.map(f=>({path:f.path,size:f.size,url:f.url||new URL(f.path,cfg.base.endsWith('/')?cfg.base:cfg.base+'/').href}));
  const total=files.reduce((a,f)=>a+f.size,0);
  let quotaMsg='';
  try{ const e=await navigator.storage.estimate(); if(e.quota && e.quota-e.usage<total) quotaMsg=' Warning: browser storage may be too small ('+fmt(e.quota-e.usage)+' free).'; }catch(e){}
  try{ await navigator.storage.persist(); }catch(e){}
  spin.style.display='none';
  statusEl.textContent='Game data needed: '+fmt(total)+'. It is saved in your browser, so this happens once.'+quotaMsg;
  dl.style.display='flex';
  const btn=document.getElementById('go'), pbar=document.getElementById('pbar'), bar=pbar.firstElementChild, ptxt=document.getElementById('ptxt');
  btn.onclick=()=>{
    btn.style.display='none'; pbar.style.display='block';
    const w=new Worker('dl-worker.js');
    w.onmessage=ev=>{
      const m=ev.data;
      if(m.type==='progress'){
        bar.style.width=(100*m.done/m.total).toFixed(1)+'%';
        const eta=m.bytesPerSec>0?Math.round((m.total-m.done)/m.bytesPerSec):0;
        ptxt.textContent=fmt(m.done)+' / '+fmt(m.total)+' - '+(m.bytesPerSec/1e6).toFixed(1)+' MB/s'+(eta?' - '+Math.floor(eta/60)+'m '+eta%60+'s left':'');
      }else if(m.type==='done'){ w.terminate(); bootEngine(); }
      else if(m.type==='error'){ w.terminate(); ptxt.textContent='Error: '+m.message; btn.textContent='Retry (resumes)'; btn.style.display=''; }
    };
    w.postMessage({cmd:'start',files,version:cfg.version});
  };
}
main().catch(e=>{msgEl.textContent='Error: '+e;});
</script>
</body></html>
